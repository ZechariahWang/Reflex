# Physical description of the hand. Single source of truth: the URDF (sim +
# visualization) and the HAL (command scaling) are both generated from this.
# Units: metres, kilograms, radians.

# right | left. Finger mounts below are written for a RIGHT hand; "left" mirrors
# them (y, roll and yaw flip sign) when the URDF is generated.
handedness: left

palm:
  length: 0.060      # along the fingers' curl direction (X)
  width: 0.088       # across the knuckles (Y)
  thickness: 0.008
  mass: 0.150

# Every finger is one rigid segment on one hinge (1 DOF).
#   length/width : size of the segment, pivot -> tip
#   min/max_angle: hinge travel. 0 = fully open
#   mount_xyz/rpy: (right-hand values) where the hinge sits on the palm (palm
#                  centre = origin) and
#                  which way it faces. Fingers hang along -Z and curl towards -X
#                  of their own mount frame.
fingers:
  thumb:
    length: 0.045
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [-0.020, 0.055, 0.0]
    mount_rpy: [0.0, 0.0, 1.5708]    # turned 90 deg so it curls across the palm
  index:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, 0.033, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  middle:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, 0.011, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  ring:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, -0.011, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  pinky:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, -0.033, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]

# Servo / hinge physics (sim only)
joint:
  max_effort: 1.0      # N m
  max_velocity: 3.0    # rad/s
  damping: 0.01
  friction: 0.0

# Where the hand is bolted into the sim world (nobody is wearing it there).
# Default: fingers pointing forward (+X world), curling downward.
sim_mount:
  xyz: [0.0, 0.0, 0.30]
  rpy: [0.0, -1.5708, 0.0]

# Real servos (HAL feetech backend only). Steps are 0..4095 (4096 per turn).
# closed_step < open_step is correct for a mirrored servo. Find the values with
# `ros2 run htn_control servo_tool jog <id>`.
servos:
  torque_limit: 300    # 0..1000, fraction of stall torque, set at each start
  thumb:  {id: 1, open_step: 2048, closed_step: 3072}
  index:  {id: 2, open_step: 2048, closed_step: 3072}
  middle: {id: 3, open_step: 2048, closed_step: 3072}
  ring:   {id: 4, open_step: 2048, closed_step: 3072}
  pinky:  {id: 5, open_step: 2048, closed_step: 3072}
