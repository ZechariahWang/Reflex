# Physical description of the hand. Single source of truth: the URDF (sim +
# visualization) and the HAL (command scaling) are both generated from this.
# Units: metres, kilograms, radians.

# The CAD is a LEFT hand (thumb on the +X side of base_link, fingers along +Y,
# curling towards -Z). Informational: the geometry itself comes from the meshes.
handedness: left

# Geometry lives in the CAD export, not here: meshes/ and config/linkage.yaml
# are generated by tools/cad_to_linkage.py (pivots, which way each horn closes,
# where the linkage binds). This file keeps what a person decides.

base:
  mass: 0.63         # from the CAD, servos included (sim only)

# <finger>_joint is the SERVO HORN. 0 = open = the CAD pose, positive closes.
#   max_angle: horn angle at "fully closed" (normalized 1.0) = the servo travel set
#              in the calibration window, |closed_step - open_step| / 651.9 (the
#              window writes it). Uncalibrated fingers hold linkage.yaml's
#              closed_rad = a 90 deg curl of the contact pad. It must stay below
#              lock_rad there (the linkage binds at 84 deg for middle/ring, 98-100
#              deg for the others) - linkage_publisher refuses to start otherwise.
#   min_angle: horn angle at "fully open" (normalized 0.0). 0 = the hand opens to the CAD pose.
#              Negative = it opens PAST it (room: linkage.yaml's open_lock_rad). Every finger
#              now opens AT the CAD pose, like index and middle: ring and pinky close at
#              linkage.yaml's closed_rad, a 90 deg curl. Their calibrated servo travel (101 and
#              96 deg) is more than this, so on the real hand the HAL maps 0..1 onto only part
#              of it - see docs/notes/next-work.md; the earlier "open past the CAD pose" split
#              folded those two fingers in the viewer and the sim.
#   mass     : inertia of the horn in the simulation only
fingers:
  thumb:  {min_angle: 0.0, max_angle: 1.0140, mass: 0.020}
  index:  {min_angle: 0.0, max_angle: 1.2502, mass: 0.020}
  middle: {min_angle: 0.0, max_angle: 1.2747, mass: 0.020}
  ring:   {min_angle: 0.0, max_angle: 1.2523, mass: 0.020}
  pinky:  {min_angle: 0.0, max_angle: 1.2828, mass: 0.020}

# Looks only (RGB 0..1). No effect on collisions, masses or control.
appearance:
  body:   [0.12, 0.13, 0.15]   # base: palm shell with the servos
  servo:  [0.23, 0.24, 0.27]   # servo horns
  finger: [0.82, 0.84, 0.87]   # linkage bars and pushrods
  accent: [0.95, 0.42, 0.12]   # triangles (bell cranks) and adapters
  pad:    [0.04, 0.04, 0.05]   # contact pads on the wearer's fingers
  wearer: [0.80, 0.78, 0.75]   # mannequin hand from the CAD (static reference)
  camera: [0.35, 0.36, 0.39]   # RealSense body
  pcb:    [0.10, 0.27, 0.20]   # PCB, connectors, standoffs, carrier plate

# The RealSense on the hand. Where it sits comes from the CAD
# (config/static_parts.yaml: front glass centre, looking along +Y, the two
# imagers along Z). How it is turned about its view axis cannot be read off a
# box, so it is set here. camera_link is ROS style: x out of the lenses, y to
# the camera's left, z up.
#   [1.5708, 0, 1.5708]  : camera's top towards +X (the thumb side)   <- assumed
#   [-1.5708, 0, 1.5708] : camera's top towards -X (the pinky side)
# If the point cloud shows up mirrored top-to-bottom next to the hand, use the other.
camera:
  rpy: [1.5708, 0.0, 1.5708]

# Servo / hinge physics (sim only)
joint:
  max_effort: 1.0      # N m
  max_velocity: 6.0    # rad/s (sim only). Above the HAL's max_speed of 4.0 travels/s (~5 rad/s), or the sim caps it
  damping: 0.01
  friction: 0.0

# Where the hand is bolted into the sim world (nobody is wearing it there).
# Default: the CAD frame as it is - fingers along +Y, curling downward.
sim_mount:
  xyz: [0.0, 0.0, 0.30]
  rpy: [0.0, 0.0, 0.0]

# Real servos (HAL feetech backend only): Feetech STS3215, 7.4 V, 1:345, on a
# Waveshare bus servo adapter (CH343 -> /dev/ttyACM0, 1 Mbaud). The adapter passes
# its supply straight to the servos: feed it 6 .. 8.4 V, NOT 12 V.
# Steps are 0..4095 (4096 per turn = 651.9 per rad). <finger>_joint is the servo
# horn, so:   closed_step = open_step +- max_angle * 651.9
# (836 steps for thumb/index/pinky, 816 for middle/ring; + or - depends on how the
# servo is mounted). `ros2 run htn_control servo_tool calibrate` is a window: set
# OPEN and CLOSED of each finger by eye, Save writes these lines. Mind the span:
# by the CAD the linkage binds 10 .. 25 deg of horn past closed (at 958 steps for
# middle/ring), and ~30 deg past open. The window warns, it does not stop you.
#
# `enabled: false` = not calibrated: the HAL never gives that servo torque or a goal.
# Saving a finger in the calibration window rewrites its line (which enables it) and
# sets its max_angle above to the travel that was set, so the 3D views show the real
# horn angle. Fingers still on open_step 2048 are guesses.
servos:
  torque_limit: 700    # 0..1000, drive duty cap in free motion (speed AND stall torque)
  hold_torque: 60     # the same while a finger is blocked: the force it keeps pushing with
  thumb:  {id: 1, open_step: 1496, closed_step: 2157}
  index:  {id: 2, open_step: 2028, closed_step: 1213}
  middle: {id: 3, open_step: 1760, closed_step: 929}
  ring:   {id: 4, open_step: 1936, closed_step: 3091}
  pinky:  {id: 5, open_step: 2146, closed_step: 3234}

# Contact stop (hal/contact.py, design in docs/specs/hal-safety-design.md): a finger
# that meets resistance gets hold_torque and a frozen setpoint. Resistance = the mA above
# blocked_current, summed over the cycles (a cycle below it takes its shortfall off again),
# reach blocked_excess, or (encoder rule, the fallback) it has to move and
# does not. In finger travel (0..1) and HAL cycles (50 Hz). blocked_current was found on the
# hand with `servo_tool probe`; the encoder values are NOT tuned on the hand yet.
contact_stop:
  enabled: true
  blocked_current: 100   # mA; remove the line to use the encoder rule alone
  blocked_excess: 150    # mA: one cycle at 250 mA, or 3 at 150. On the hand a free start of the
                         # middle finger summed to 34, a push against it to 162 in 3 cycles
  blocked_error: 0.06    # further than this from the setpoint = it has to move
  blocked_motion: 0.004  # less travel than this over blocked_cycles = it does not
  blocked_cycles: 10     # 0.2 s
  hold_lead: 0.03        # the frozen setpoint sits this far past the obstacle
