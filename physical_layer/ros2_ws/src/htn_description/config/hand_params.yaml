# Physical description of the hand. Single source of truth: the URDF (sim +
# visualization) and the HAL (command scaling) are both generated from this.
# Units: metres, kilograms, radians.

# right | left. Finger mounts below are written for a RIGHT hand; "left" mirrors
# them (y, roll and yaw flip sign) when the URDF is generated.
handedness: left

palm:
  length: 0.060      # along the fingers' curl direction (X)
  width: 0.088       # across the knuckles (Y)
  thickness: 0.008
  mass: 0.150

# Every finger is one rigid segment on one hinge (1 DOF).
#   length/width : size of the segment, pivot -> tip
#   min/max_angle: hinge travel. 0 = fully open
#   mount_xyz/rpy: (right-hand values) where the hinge sits on the palm (palm
#                  centre = origin) and
#                  which way it faces. Fingers hang along -Z and curl towards -X
#                  of their own mount frame.
fingers:
  thumb:
    length: 0.045
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [-0.020, 0.055, 0.0]
    mount_rpy: [0.0, 0.0, 1.5708]    # turned 90 deg so it curls across the palm
  index:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, 0.033, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  middle:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, 0.011, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  ring:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, -0.011, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]
  pinky:
    length: 0.060
    width: 0.012
    mass: 0.020
    min_angle: 0.0
    max_angle: 1.57
    mount_xyz: [0.030, -0.033, 0.0]
    mount_rpy: [0.0, 0.0, 0.0]

# Looks only (RGB 0..1). No effect on collisions, masses or control.
appearance:
  body:   [0.12, 0.13, 0.15]   # palm plate, back housing, finger bands
  servo:  [0.23, 0.24, 0.27]   # servo blocks behind each knuckle
  finger: [0.82, 0.84, 0.87]   # finger segments
  accent: [0.95, 0.42, 0.12]   # knuckle hinges, stripe
  pad:    [0.04, 0.04, 0.05]   # rubber: fingertip pads, wrist cuff

# Servo / hinge physics (sim only)
joint:
  max_effort: 1.0      # N m
  max_velocity: 3.0    # rad/s
  damping: 0.01
  friction: 0.0

# Where the hand is bolted into the sim world (nobody is wearing it there).
# Default: fingers pointing forward (+X world), curling downward.
sim_mount:
  xyz: [0.0, 0.0, 0.30]
  rpy: [0.0, -1.5708, 0.0]

# Real servos (HAL serial backend only): servo angle, in degrees, at finger
# fully open / fully closed. Swap the two numbers for a mirrored servo.
servos:
  thumb:  {open_deg: 0.0, closed_deg: 90.0}
  index:  {open_deg: 0.0, closed_deg: 90.0}
  middle: {open_deg: 0.0, closed_deg: 90.0}
  ring:   {open_deg: 0.0, closed_deg: 90.0}
  pinky:  {open_deg: 0.0, closed_deg: 90.0}
